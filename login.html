<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nextro Login - Sign In or Create Account</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 400px; padding: 20px; }
    .card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 40px; }
    .logo { text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 30px; }
    .logo span { color: #0070f3; }
    h2 { font-size: 24px; margin-bottom: 10px; }
    .subtitle { color: #888; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #ddd; }
    input { width: 100%; padding: 12px; border: 1px solid #333; background: #0a0a0a; color: #fff; border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: #0070f3; }
    .btn { width: 100%; padding: 12px; background: #0070f3; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #0051a8; }
    .divider { text-align: center; margin: 20px 0; color: #666; }
    .tab { display: inline-block; padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent; margin-right: 20px; }
    .tab.active { border-bottom-color: #0070f3; color: #0070f3; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
    .footer-link a { color: #0070f3; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">Nex<span>tro</span></div>
      
      <div style="display: flex; border-bottom: 1px solid #222; margin-bottom: 30px;">
        <div class="tab active" onclick="switchTab('signin')">Sign In</div>
        <div class="tab" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <!-- Sign In -->
      <div id="signin" class="tab-content active">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your creator dashboard</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password">
        </div>
        <button class="btn">Sign In</button>
        <div class="footer-link"><a href="#">Forgot password?</a></div>
      </div>

      <!-- Sign Up -->
      <div id="signup" class="tab-content">
        <h2>Create Account</h2>
        <p class="subtitle">Join Nextro for free</p>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Create a password">
        </div>
        <button class="btn">Create Account</button>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
